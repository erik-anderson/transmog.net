<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser frame treatments</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 24px; background: #faf8f2; color: #243238; font-family: "Segoe UI", system-ui, sans-serif; }
    .demo-controls { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
    .demo-controls label { display: grid; gap: 6px; font-size: 13px; }
    .demo-controls select { min-width: 180px; padding: 8px; font: inherit; }
    body[data-capture] { margin: 0; background: transparent; }
    body[data-capture] .demo-controls { display: none; }

    /* All dimensions below are logical pixels. Capture this element at 2×. */
    .browser-window { width: 902px; border: 1px solid #bababa; background: #fff; color: #343434; }
    .title-bar { position: relative; display: flex; align-items: flex-end; height: 40px; padding-left: 12px; background: #f3f3f3; }
    /* Transform the native bitmap to logical size without fractional layout resampling. */
    .window-controls { position: absolute; top: 0; right: 0; width: 243px; height: 57px; transform: scale(.5); transform-origin: top right; }
    .browser-tab { position: relative; display: flex; align-items: center; gap: 9px; width: 258px; height: 32px; padding: 0 13px; border-radius: 9px 9px 0 0; background: #fff; font-size: 12px; }
    .tab-title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .page-icon { width: 12px; height: 14px; border: 1px solid #777; border-radius: 2px; flex: none; }
    .page-icon::after { content: ""; display: block; width: 5px; margin: 4px 2px; border-top: 1px solid #888; box-shadow: 0 3px #888; }
    .tab-close { position: relative; width: 12px; height: 12px; flex: none; }
    .tab-close::before, .tab-close::after { content: ""; position: absolute; top: 5.5px; left: 1px; width: 10px; height: 1px; background: #555; transform: rotate(45deg); }
    .tab-close::after { transform: rotate(-45deg); }
    .new-tab { display: grid; place-items: center; width: 34px; height: 32px; font-size: 21px; font-weight: 300; color: #555; }
    .toolbar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-bottom: 1px solid #d9d9d9; background: #fff; }
    .navigation { display: flex; align-items: center; gap: 3px; }
    .navigation button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #444; }
    .navigation button:disabled { color: #b2b2b2; }
    .navigation button:not(:disabled):hover { background: #e8e8e8; }
    /* One connected silhouette; mirroring preserves every join and stroke. */
    .arrow { width: 16px; height: 16px; background: currentColor; clip-path: polygon(6.25% 50%, 46.875% 9.375%, 53.125% 15.625%, 23.4375% 45.3125%, 93.75% 45.3125%, 93.75% 54.6875%, 23.4375% 54.6875%, 53.125% 84.375%, 46.875% 90.625%); }
    .forward { transform: scaleX(-1); }
    .reload { position: relative; width: 14px; height: 14px; border: 1.5px solid; border-right-color: transparent; border-radius: 50%; }
    .reload::after { content: ""; position: absolute; right: -1.5px; top: -1.5px; width: 5px; height: 5px; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(6deg); }
    .address { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; height: 30px; padding: 0 12px; border-radius: 16px; background: #f3f3f3; font-size: 12px; }
    .site-icon { width: 12px; height: 12px; border: 1px solid #818181; border-radius: 50%; position: relative; flex: none; }
    .site-icon::before { content: ""; position: absolute; top: 4px; left: 0; width: 10px; border-top: 1px solid #818181; }
    .site-icon::after { content: ""; position: absolute; top: 0; left: 3px; width: 4px; height: 10px; border-left: 1px solid #818181; border-right: 1px solid #818181; border-radius: 50%; }
    .url { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #383838; }
    .url-path { color: #777; }
    .snapshot-viewport { position: relative; width: 900px; height: 600px; overflow: hidden; background: #f8f6ef; }
    .snapshot { position: absolute; width: 902px; max-width: none; height: auto; left: -1px; bottom: -1px; display: block; }

    .browser-window[data-treatment="floating"] .title-bar { height: 44px; align-items: center; }
    .browser-window[data-treatment="floating"] .browser-tab { width: 250px; height: 29px; border: 1px solid #dedede; border-radius: 9px; box-shadow: 0 1px 2px #0000000d; }
    .browser-window[data-treatment="floating"] .toolbar { background: #f3f3f3; padding-bottom: 5px; height: 44px; }
    .browser-window[data-treatment="floating"] .address { height: 31px; background: #fff; border: 1px solid #dedede; border-radius: 8px; }
    .browser-window[data-treatment="floating"] .navigation button { border-radius: 50%; }

    /* The floating treatment's soft surfaces with one continuous tab outline. */
    .browser-window[data-treatment="joined"] .title-bar { height: 44px; padding-left: 12px; border-bottom: 1px solid #d1d1d1; }
    .browser-window[data-treatment="joined"] .browser-tab { z-index: 1; bottom: -1px; width: 250px; height: 36px; border: 1px solid #d1d1d1; border-bottom-color: #f3f3f3; border-radius: 9px 9px 0 0; background: #fff; }
    .browser-window[data-treatment="joined"] .new-tab { height: 36px; }
    .browser-window[data-treatment="joined"] .toolbar { height: 44px; padding-bottom: 5px; background: #f3f3f3; }
    .browser-window[data-treatment="joined"] .address { height: 31px; border: 1px solid #dedede; border-radius: 8px; background: #fff; }
    .browser-window[data-treatment="joined"] .navigation button { border-radius: 50%; }

    .browser-window[data-treatment="compact"] .title-bar { height: 34px; padding-left: 8px; }
    .browser-window[data-treatment="compact"] .browser-tab { width: 218px; height: 29px; border: 1px solid #d6d6d6; border-bottom: 0; border-radius: 4px 4px 0 0; }
    .browser-window[data-treatment="compact"] .new-tab { height: 29px; }
    .browser-window[data-treatment="compact"] .toolbar { height: 34px; padding: 0 9px; gap: 10px; }
    .browser-window[data-treatment="compact"] .navigation { gap: 0; padding-right: 8px; border-right: 1px solid #ddd; }
    .browser-window[data-treatment="compact"] .navigation button { width: 26px; height: 26px; }
    .browser-window[data-treatment="compact"] .address { height: 26px; padding-left: 0; background: transparent; border-radius: 0; }
  </style>
</head>
<body>
  <div class="demo-controls">
    <label>Treatment<select id="treatment"><option value="joined">Joined tab</option><option value="raised">Raised tab</option><option value="floating">Floating tab</option><option value="compact">Compact tab</option></select></label>
    <label>Response<select id="response"><option value="original">Original response</option><option value="modified">Modified response</option></select></label>
  </div>
  <main class="browser-window" id="browser-window" data-treatment="joined" aria-label="Generic browser preview">
    <div class="title-bar">
      <div class="browser-tab"><span class="page-icon" aria-hidden="true"></span><span class="tab-title">Fieldwork — Desk collection</span><span class="tab-close" aria-hidden="true"></span></div>
      <span class="new-tab" aria-hidden="true">+</span>
      <img class="window-controls" src="screenshot-assets/right-windows-title-bar.png" width="243" height="57" alt="Windows minimize, maximize, and close controls">
    </div>
    <div class="toolbar">
      <nav class="navigation" aria-label="Browser navigation">
        <button type="button" disabled aria-label="Back"><span class="arrow" aria-hidden="true"></span></button>
        <button type="button" disabled aria-label="Forward"><span class="arrow forward" aria-hidden="true"></span></button>
        <button type="button" id="reload" aria-label="Reload"><span class="reload" aria-hidden="true"></span></button>
      </nav>
      <div class="address" aria-label="Address: shop.example.test/products"><span class="site-icon" aria-hidden="true"></span><span class="url">shop.example.test<span class="url-path">/products</span></span></div>
    </div>
    <div class="snapshot-viewport"><img class="snapshot" src="../assets/screenshots/preview-original.png" width="1804" height="1380" alt="Captured fictional Fieldwork shop"></div>
  </main>
  <script>
    const parameters = new URLSearchParams(location.search);
    if (parameters.has("capture")) document.body.dataset.capture = "";
    const browserWindow = document.getElementById("browser-window");
    const snapshotImage = document.querySelector(".snapshot");
    const controlsImage = document.querySelector(".window-controls");
    const treatmentSelect = document.getElementById("treatment");
    const responseSelect = document.getElementById("response");
    const sources = {
      original: "../assets/screenshots/preview-original.png",
      modified: "../assets/screenshots/preview-css-change.png",
    };
    // The capture runner can supply a fresh, unframed snapshot. The standalone
    // defaults align the page to the bottom border, independent of header height.
    window.renderBrowserFrame = async ({
      treatment = "joined", response = "original", snapshot,
      density = 2, sourceWidth,
      contentBounds = { x: 2, width: 1800, height: 1200 },
    } = {}) => {
      if (!["joined", "raised", "floating", "compact"].includes(treatment) || !sources[response])
        throw new Error("Unknown browser frame treatment or response");
      browserWindow.dataset.treatment = treatment;
      treatmentSelect.value = treatment;
      responseSelect.value = response;
      browserWindow.style.width = contentBounds.width / density + 2 + "px";
      const viewport = document.querySelector(".snapshot-viewport");
      viewport.style.width = contentBounds.width / density + "px";
      viewport.style.height = contentBounds.height / density + "px";
      snapshotImage.src = snapshot || sources[response];
      await Promise.all([snapshotImage.decode(), controlsImage.decode(), document.fonts.ready]);
      const y = contentBounds.y ?? snapshotImage.naturalHeight - contentBounds.height - contentBounds.x;
      snapshotImage.style.width = (sourceWidth ?? snapshotImage.naturalWidth) / density + "px";
      snapshotImage.style.left = -contentBounds.x / density + "px";
      snapshotImage.style.top = -y / density + "px";
      snapshotImage.style.bottom = "auto";
      return { width: browserWindow.offsetWidth, height: browserWindow.offsetHeight };
    };
    const update = () => window.renderBrowserFrame({ treatment: treatmentSelect.value, response: responseSelect.value });
    treatmentSelect.addEventListener("change", update);
    responseSelect.addEventListener("change", update);
    document.getElementById("reload").addEventListener("click", () => snapshotImage.decode());
    window.browserFrameReady = window.renderBrowserFrame({
      treatment: parameters.get("treatment") || "joined",
      response: parameters.get("response") || "original",
    });
  </script>
</body>
</html>
